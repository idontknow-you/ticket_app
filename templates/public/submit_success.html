{% extends "base.html" %}
{% block title %}Submitted — {{ form.name }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-8 py-24 text-center">
  <div class="w-14 h-14 bg-emerald-50 border border-emerald-200 rounded-full flex items-center justify-center mx-auto mb-6">
    <svg class="w-6 h-6 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
    </svg>
  </div>
  <h1 class="font-serif text-3xl text-ink mb-3">Thank you!</h1>
  <p class="text-muted">Your <strong class="text-ink">{{ form.name }}</strong> request has been submitted. We'll be in touch soon.</p>
  <a href="{{ url_for('public.index', form=form.slug) }}"
     class="inline-block mt-8 text-sm text-ink underline underline-offset-4 hover:text-muted transition">
    Submit another response
  </a>
</div>
{% endblock %}
