{% extends "base.html" %}
{% block title %}No Access — Support System{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-sm text-center">

    <div class="bg-white border border-line rounded-2xl shadow-sm px-8 py-10">

      <div class="w-12 h-12 rounded-full bg-faint border border-line flex items-center justify-center mx-auto mb-5">
        <svg class="w-5 h-5 text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m0 0v2m0-2h2m-2 0H10m2-11a4 4 0 014 4v1H8v-1a4 4 0 014-4z"/>
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        </svg>
      </div>

      <h1 class="font-serif text-2xl font-bold text-ink mb-2">No access yet</h1>
      <p class="text-muted text-sm leading-relaxed">
        Your account is active but no modules have been assigned to you.
        Contact your administrator to get access.
      </p>

      <div class="mt-8 pt-6 border-t border-line">
        <a href="{{ url_for('auth.logout') }}"
           class="text-sm text-muted hover:text-ink transition">
          Sign out
        </a>
      </div>

    </div>

  </div>
</div>
{% endblock %}
