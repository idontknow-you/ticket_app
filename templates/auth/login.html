{% extends "base.html" %}

{% block title %}Admin Login — Support System{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-64px)] flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-sm">

    <div class="text-center mb-8">
      <h1 class="font-serif text-3xl font-bold text-gray-900">Login</h1>
      <p class="text-gray-500 text-sm mt-2">Sign in to manage support tickets</p>
    </div>

    <div class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
      <form method="POST" action="{{ url_for('auth.login') }}" novalidate>

        <div class="px-8 py-8 space-y-5">

          <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
              Username
            </label>
            <input
              type="text"
              id="username"
              name="username"
              required
              autofocus
              placeholder="Enter your username"
              class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm text-gray-900
                     placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500
                     focus:border-transparent transition"
            >
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
              Password
            </label>
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="Enter your password"
              class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm text-gray-900
                     placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500
                     focus:border-transparent transition"
            >
          </div>

        </div>

        <div class="px-8 py-5 bg-gray-50 border-t border-gray-100">
          <button
            type="submit"
            class="w-full bg-indigo-900 hover:bg-indigo-700 active:bg-indigo-800
                   text-white font-medium text-sm px-6 py-2.5 rounded-lg transition"
          >
            Sign in
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
{% endblock %}
