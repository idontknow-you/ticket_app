{% extends "base.html" %}
{% block title %}Reset Password — Support System{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div class="w-full max-w-sm">

    <div class="mb-8 text-center">
      <h1 class="font-serif text-2xl text-ink mb-1">Set new password</h1>
      {% if user %}
        <p class="text-sm text-muted">For <span class="font-medium text-ink">{{ user.username }}</span></p>
      {% endif %}
    </div>

    <div class="bg-white border border-line rounded-2xl p-6">
      <form method="POST">
        <div class="mb-4">
          <label class="block text-xs text-muted font-medium mb-1.5">New Password</label>
          <input type="password" name="password" required autofocus
                 placeholder="At least 6 characters"
                 class="w-full border border-line rounded-lg px-3 py-2.5 text-sm text-ink placeholder-gray-300
                        focus:outline-none focus:border-ink transition font-sans">
        </div>
        <div class="mb-5">
          <label class="block text-xs text-muted font-medium mb-1.5">Confirm Password</label>
          <input type="password" name="confirm_password" required
                 placeholder="Repeat your password"
                 class="w-full border border-line rounded-lg px-3 py-2.5 text-sm text-ink placeholder-gray-300
                        focus:outline-none focus:border-ink transition font-sans">
        </div>
        <button type="submit"
                class="w-full bg-ink text-white text-sm font-medium py-2.5 rounded-lg hover:bg-gray-800 transition">
          Reset Password
        </button>
      </form>
    </div>

  </div>
</div>
{% endblock %}
